name: Release

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:
    inputs:
      notes:
        description: "Additional release notes (optional)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false  # Never cancel a release in progress

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # Required to create GitHub Releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ---------------------------------------------------------------------------
      # Extract version from Gradle build file (single source of truth)
      # ---------------------------------------------------------------------------
      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'val appVersionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep 'val appVersionCode' app/build.gradle.kts | grep -oP '\d+')
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      # ---------------------------------------------------------------------------
      # Signing: decode keystore from GitHub Secret
      # ---------------------------------------------------------------------------
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "WARNING: KEYSTORE_BASE64 not set — APK will be unsigned"
          fi

      # ---------------------------------------------------------------------------
      # Run tests before building release
      # ---------------------------------------------------------------------------
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: "**/build/reports/tests/"
          retention-days: 14

      # ---------------------------------------------------------------------------
      # Build signed release APK
      # ---------------------------------------------------------------------------
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pgithub.repo=${{ github.repository }} \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_NAME="LifePilot-${{ steps.version.outputs.name }}-${{ github.sha }}.apk"
          mv "$APK_PATH" "$APK_NAME"
          echo "path=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "APK: ${APK_NAME}"

      # ---------------------------------------------------------------------------
      # Assemble release notes
      # ---------------------------------------------------------------------------
      - name: Assemble release notes
        id: notes
        run: |
          MANUAL_NOTES="${{ github.event.inputs.notes }}"
          COMMITS=$(git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD 2>/dev/null | head -20 || echo "- Initial release")
          {
            echo "body<<EOF"
            if [ -n "$MANUAL_NOTES" ]; then
              echo "$MANUAL_NOTES"
              echo ""
            fi
            echo "## What's new"
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "**Version:** ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})"
            echo "**Built:** ${{ steps.version.outputs.build_time }}"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ---------------------------------------------------------------------------
      # Create or update GitHub Release
      # ---------------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "LifePilot ${{ steps.version.outputs.name }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: ${{ steps.apk.outputs.path }}
          make_latest: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
