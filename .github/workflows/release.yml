name: Release

# Fires ONLY when you push a version tag (e.g. v1.2.0).
# Every regular branch/PR push goes through ci.yml (tests only) — not this file.
# To release: bump versionCode + versionName in app/build.gradle.kts, commit, then:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notes:
        description: "Additional release notes (optional)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Extract version from build file (single source of truth) ───────────
      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep 'val appVersionName' app/build.gradle.kts | grep -oP '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep 'val appVersionCode' app/build.gradle.kts | grep -oP '\d+')
          echo "name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      # ── Signing: decode keystore from GitHub Secret ─────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            echo "KEYSTORE_PATH=${{ github.workspace }}/keystore.jks" >> $GITHUB_ENV
            echo "Keystore decoded"
          else
            echo "WARNING: KEYSTORE_BASE64 not set — APKs will be unsigned (debug-signed)"
          fi

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --no-daemon

      # ── Build demo flavor ───────────────────────────────────────────────────
      - name: Build demo release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          ./gradlew assembleDemoRelease \
            -Pgithub.repo=${{ github.repository }} \
            --no-daemon

      # ── Build standard flavor ───────────────────────────────────────────────
      - name: Build standard release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleStandardRelease \
            -Pgithub.repo=${{ github.repository }} \
            --no-daemon

      # ── Assemble release notes ──────────────────────────────────────────────
      - name: Assemble release notes
        id: notes
        run: |
          MANUAL_NOTES="${{ github.event.inputs.notes }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          COMMITS=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD" 2>/dev/null | head -20 || echo "- Initial release")
          {
            echo "body<<EOF"
            [ -n "$MANUAL_NOTES" ] && echo "$MANUAL_NOTES" && echo ""
            echo "## What's new"
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "**Version:** ${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.code }})"
            echo "**Built:** ${{ steps.version.outputs.build_time }}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ── Publish ─────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LifePilot ${{ steps.version.outputs.name }}"
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/demo/release/LifePilot-demo-${{ steps.version.outputs.name }}.apk
            app/build/outputs/apk/standard/release/LifePilot-standard-${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
