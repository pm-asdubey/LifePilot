name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  unit-tests:
    name: JVM Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run all JVM unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

      - name: Summarize test results
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          total=0
          passed=0
          failed=0
          skipped=0
          for xml in $(find . -path "*/build/test-results/*/TEST-*.xml" -not -path "*/build/intermediates/*" 2>/dev/null); do
            t=$(grep -oP 'tests="\K[0-9]+' "$xml" | head -1 || echo 0)
            f=$(grep -oP 'failures="\K[0-9]+' "$xml" | head -1 || echo 0)
            e=$(grep -oP 'errors="\K[0-9]+' "$xml" | head -1 || echo 0)
            s=$(grep -oP 'skipped="\K[0-9]+' "$xml" | head -1 || echo 0)
            total=$((total + t))
            failed=$((failed + f + e))
            skipped=$((skipped + s))
          done
          passed=$((total - failed - skipped))
          echo "| Metric  | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Total   | $total |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed  | $passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed  | $failed |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $skipped |" >> $GITHUB_STEP_SUMMARY
          if [ "$failed" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **$failed test(s) failed. Download the 'test-reports' artifact for details.**" >> $GITHUB_STEP_SUMMARY
          fi
